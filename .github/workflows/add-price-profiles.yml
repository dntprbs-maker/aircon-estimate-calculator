name: Add price profile management
on:
  push:
    paths:
      - 'tools/add_price_profiles.py'
      - '.github/workflows/add-price-profiles.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch original M1.3.1
        run: python tools/add_price_profiles.py
      - name: Commit patched calculator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "add customer price profile management to M1.3.1"
          git push