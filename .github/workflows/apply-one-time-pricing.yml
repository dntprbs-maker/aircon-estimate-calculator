name: Apply one-time pricing
on:
  push:
    paths:
      - 'tools/add_one_time_pricing.py'
      - '.github/workflows/apply-one-time-pricing.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/add_one_time_pricing.py
      - name: Commit patched calculator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add one-time editable price table mode"
          git push
